name: bikemap_dc
description: "DC Collaborative Bike Map"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Supabase
  supabase_flutter: ^2.9.0

  # Location
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # State
  provider: ^6.1.2

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Storage / Prefs
  shared_preferences: ^2.3.5

  # Utils
  url_launcher: ^6.3.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/logo.png"
  min_sdk_android: 21
  background_color: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/logo.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/avatars/
    - assets/branding/
